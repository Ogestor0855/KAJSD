<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Admin GTA IV CLIP LUCRO</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a09;--panel:#141210;--line:rgba(241,236,227,.1);--line-2:rgba(241,236,227,.2);--ink:#f1ece3;--muted:#a59d91;--red:#c8141c;--red-txt:#ff4a52}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(60% 50% at 100% 0,rgba(143,12,18,.35),transparent 70%),radial-gradient(50% 45% at 0 100%,rgba(143,12,18,.28),transparent 70%),var(--bg)}
.box{width:100%;max-width:400px;padding:32px 24px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 24px 60px -30px rgba(0,0,0,.9)}
.logo{margin:0 0 6px;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:2rem;text-transform:uppercase;letter-spacing:.01em}
.logo span{display:inline-block;transform:skewX(-7deg)}
.logo em{font-style:normal;color:var(--red)}
.sub{margin:0 0 26px;color:var(--muted);font-size:.95rem}
label{display:block;margin:0 0 6px;font-weight:600;font-size:.9rem}
input{width:100%;height:50px;margin:0 0 16px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:#0f0d0c;color:var(--ink);font:500 1rem inherit;font-family:inherit}
input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(241,236,227,.12)}
button{width:100%;height:52px;margin-top:4px;border:0;border-radius:10px;background:var(--red);color:#fff;font:700 1rem inherit;font-family:inherit;cursor:pointer;transition:filter .15s ease}
button:hover{filter:brightness(1.1)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button[disabled]{opacity:.7;cursor:progress}
.err{min-height:1.4em;margin:12px 0 0;color:var(--red-txt);font-size:.9rem;text-align:center}
</style>
</head>
<body>
<main class="box">
  <h1 class="logo"><span>GTA <em>IV</em> Clip Lucro</span></h1>
  <p class="sub">Área administrativa</p>
  <form id="f" novalidate>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Entrar</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
(function(){
  var f = document.getElementById('f'), btn = document.getElementById('btn'), err = document.getElementById('err');
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('email').value.trim(), pw = document.getElementById('password');
    if (!email || !pw.value) { err.textContent = 'Preencha e-mail e senha.'; return; }
    btn.disabled = true; btn.textContent = 'Entrando...'; err.textContent = '';
    fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ email: email, password: pw.value })
    })
      .then(function(r){ return r.json().then(function(b){ return { ok: r.ok, body: b }; }); })
      .then(function(res){
        if (!res.ok) throw new Error(res.body.error || 'Não foi possível entrar.');
        location.replace('/admin');
      })
      .catch(function(e){
        pw.value = '';
        err.textContent = e.message === 'Failed to fetch' ? 'Falha de conexão.' : e.message;
        btn.disabled = false; btn.textContent = 'Entrar';
      });
  });
})();
</script>
</body>
</html>
